name: Cloud variant compilation
on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/cloud-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile Firebase release variants and Firebase-free Izzy
        run: bash ./gradlew :app:compileGmsReleaseKotlin :app:compileGmsFullReleaseKotlin :app:compileIzzyDebugKotlin --console=plain
